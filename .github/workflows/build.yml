name: Build Resume PDF

on:
  push:
    branches:
      - 'codex-*'
      - 'dev*'
      - 'main'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    # Allow manual triggering

# Scheduled builds only on main branch
  schedule:
    # Rebuild monthly on the 1st at 8:00 AM UTC (main branch only)
    - cron: '0 8 1 * *'

jobs:
  build-all-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing to builds branch
    if: |
      github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/share/texlive
            /usr/share/texmf
            /var/lib/texmf
          key: texlive-${{ runner.os }}-minimal
          restore-keys: |
            texlive-${{ runner.os }}-
      
      - name: Install LaTeX (minimal, ONCE for all profiles)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            latexmk \
            cm-super
      
      - name: Build all profiles
        id: build-profiles
        run: |
          mkdir -p build-outputs
          cd profiles
          for profile in *.xlsx; do
            echo "🔨 Building: $profile"
            profile_name="${profile%.xlsx}"
            
            # Generate LaTeX
            cd ..
            python scripts/generate_resume.py "$profile"
            
            # Compile PDF
            cd build
            latexmk -pdf -interaction=nonstopmode -halt-on-error -jobname="$profile_name" main.tex
            
            # Move to outputs
            mv "${profile_name}.pdf" ../build-outputs/
            cd ..
            
            echo "✅ Completed: ${profile_name}.pdf"
            cd profiles
          done
          cd ..
          
          # List all built PDFs
          echo "built_pdfs<<EOF" >> $GITHUB_OUTPUT
          ls -1 build-outputs/*.pdf >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Upload all PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes-${{ github.ref_name }}-${{ github.run_number }}
          path: build-outputs/*.pdf
          retention-days: 90
      
      - name: Create Release with all PDFs
        if: startsWith(github.ref, 'refs/heads/codex-') || startsWith(github.ref, 'refs/heads/dev')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-build-${{ github.run_number }}
          name: Resume Build - ${{ github.ref_name }} #${{ github.run_number }}
          body: |
            Automated resume build from branch `${{ github.ref_name }}`
            
            **Build Details:**
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Run Number: ${{ github.run_number }}
            - Triggered by: ${{ github.event_name }}
            - Profiles: All *.xlsx in profiles/
            
            **Download PDFs:** Click on PDF files below to download directly.
          files: build-outputs/*.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push all PDFs to builds branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Check if builds branch exists
          if git ls-remote --heads origin builds | grep -q builds; then
            git fetch origin builds
            git checkout builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi
          
          # Ensure README.md exists (create if not present)
          if [ ! -f README.md ]; then
            cat > README.md << 'EOFREADME'
          # 📄 Resume Builds Archive
          
          **This is an automated archive branch.** PDFs are built and stored here automatically by GitHub Actions.
          
          ## 🎯 What Is This Branch?
          
          Every time you update your resume data on the `main` or `dev` branches, GitHub Actions automatically:
          1. Generates the PDF from your Excel data
          2. Commits it to this `builds` branch
          3. Stores it in the `pdfs/` folder
          
          This gives you **version-controlled PDF storage** right in your repository - no need to download from Artifacts or Releases if you don't want to.
          
          ## 📥 How to Download Your Resume
          
          ### Option 1: Direct Download (Easiest)
          Navigate to the [`pdfs/`](./pdfs) folder and click on any PDF to view/download it.
          
          ### Option 2: Clone Locally
          ```bash
          git clone -b builds https://github.com/YOUR_USERNAME/no-code-cv.git resume-pdfs
          cd resume-pdfs/pdfs
          ```
          
          ### Option 3: Download Specific PDF
          ```bash
          # Replace YOUR_USERNAME and FILENAME
          wget https://github.com/YOUR_USERNAME/no-code-cv/raw/builds/pdfs/FILENAME.pdf
          ```
          
          ## 📂 Folder Structure
          
          ```
          builds/
          ├── README.md          ← You are here!
          └── pdfs/
              ├── INDEX.md       ← Build metadata (auto-generated)
              └── *.pdf          ← Your resume PDFs
          ```
          
          ## 🔄 How This Works
          
          ```
          [Push to main/dev] 
              ↓
          [GitHub Actions builds PDF]
              ↓
          [PDF saved to builds branch]
              ↓
          [You download from pdfs/ folder]
          ```
          
          Each build includes:
          - **Source branch** - Which branch triggered the build
          - **Commit SHA** - Exact code version used
          - **Build number** - Sequential build ID
          - **Timestamp** - When the build occurred
          
          Check [`pdfs/INDEX.md`](./pdfs/INDEX.md) for the latest build details.
          
          ## ⚠️ Important Notes
          
          - **Don't manually edit this branch** - It's managed by automation
          - **Don't commit directly** - Changes will be overwritten on next build
          - **PDFs are always fresh** - Each build replaces old PDFs with new ones
          - **This is your fork** - Your data stays in your repo, nowhere else
          
          ## 🔗 Related
          
          - **Main Branch** → [Go to main branch](../../tree/main) for source code and data
          - **Actions Tab** → [View build logs](../../actions) to see build history
          - **Releases** → [View releases](../../releases) for tagged/permanent versions
          
          ---
          
          **Built with:** Python • Jinja2 • LaTeX • GitHub Actions  
          **Automation:** Fully automatic, no manual intervention needed
          EOFREADME
          fi
          
          # Ensure .gitignore exists (create if not present)
          if [ ! -f .gitignore ]; then
            cat > .gitignore << 'EOFIGNORE'
          # Builds branch should ONLY contain:
          # - README.md
          # - pdfs/ folder with PDFs and INDEX.md
          
          # Ignore everything from main branch that shouldn't be here
          build/
          profiles/
          scripts/
          templates/
          .venv/
          .tmp/
          .cursor/
          
          # System files
          .DS_Store
          *.pyc
          __pycache__/
          
          # Python dependencies
          requirements.txt
          
          # Documentation from main branch
          *.md
          !README.md
          !pdfs/INDEX.md
          EOFIGNORE
          fi
          
          # Copy all PDFs
          mkdir -p pdfs
          cp build-outputs/*.pdf pdfs/
          
          # Create index
          cat > pdfs/INDEX.md << EOF
          # Resume Builds
          
          Built from: \`${{ github.ref_name }}\` branch
          Commit: \`${{ github.sha }}\`
          Build: #${{ github.run_number }}
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Available Resumes
          EOF
          
          ls -1 pdfs/*.pdf | while read pdf; do
            filename=$(basename "$pdf")
            echo "- [$filename]($filename)" >> pdfs/INDEX.md
          done
          
          # Commit and push (add README and .gitignore if new)
          git add README.md .gitignore pdfs/
          git commit -m "Build: All profiles from ${{ github.ref_name }} #${{ github.run_number }}" || echo "No changes"
          git push origin builds
          
      - name: Build summary
        run: |
          echo "### ✅ All Resumes Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Built Profiles:**" >> $GITHUB_STEP_SUMMARY
          ls -1 build-outputs/*.pdf | while read pdf; do
            filename=$(basename "$pdf")
            echo "- \`$filename\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Access PDFs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Actions tab (90 days)" >> $GITHUB_STEP_SUMMARY
          echo "- Release: Release page (permanent)" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`builds\` branch → \`pdfs/\` folder" >> $GITHUB_STEP_SUMMARY

